name: Publish Nexus Core v0.9.12-rc.3 (candidate)

# A GitHub prerelease is NOT the stable v0.9.12. The stable publish workflow
# remains deliberately blocked until real Ubuntu 26.04 acceptance is recorded.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: nexus-core-v0912-rc3-publish
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and publish immutable candidate
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify immutable candidate and exact tested main commit
        id: verify
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          git fetch origin main --tags
          if [[ "$version" != "0.9.12" || "$(git rev-parse HEAD)" != "$TESTED_SHA" || "$(git rev-parse origin/main)" != "$TESTED_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Candidate skipped: main advanced, SHA differs or version mismatch."
            exit 0
          fi
          if git show-ref --verify --quiet refs/tags/v0.9.12-rc.3; then
            target="$(git rev-list -n 1 v0.9.12-rc.3)"
            if [[ "$target" != "$TESTED_SHA" ]]; then
              echo "::error::Candidate tag exists at another commit. Never move tags."
              exit 1
            fi
          fi
          if gh release view v0.9.12-rc.3 >/dev/null 2>&1; then
            published="$(gh release view v0.9.12-rc.3 --json isPrerelease --jq .isPrerelease)"
            if [[ "$published" != "true" ]]; then
              echo "::error::Existing candidate tag has a non-prerelease publication."
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Candidate already published; leaving immutable."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Build and check candidate wheel
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'build==1.3.0'
          python -m build --wheel
          wheel=dist/nexus_core-0.9.12-py3-none-any.whl
          test -s "$wheel"
          sha256sum "$wheel" | tee dist/SHA256SUMS
          python -m zipfile --test "$wheel"
      - name: Publish annotated tag and GitHub prerelease
        if: steps.verify.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git show-ref --verify --quiet refs/tags/v0.9.12-rc.3; then
            git tag -a v0.9.12-rc.3 -m "Nexus Core 0.9.12-rc.3 — candidate, physical acceptance pending"
            git push origin refs/tags/v0.9.12-rc.3
          fi
          gh release create v0.9.12-rc.3 \
            dist/nexus_core-0.9.12-py3-none-any.whl \
            dist/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "NEXUS CORE v0.9.12-rc.3 — candidato para testes" \
            --notes-file docs/RELEASE_NOTES_v0.9.12-rc.3.md
          check="$(gh release view v0.9.12-rc.3 --json isPrerelease --jq .isPrerelease)"
          test "$check" = "true"
          assets="$(gh release view v0.9.12-rc.3 --json assets --jq '[.assets[].name] | sort | join(",")')"
          test "$assets" = "SHA256SUMS,nexus_core-0.9.12-py3-none-any.whl"
          echo "Prerelease published and asset names verified. Stable release remains blocked."
