name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Python 3.12 / Linux / PostgreSQL / Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_TEST_POSTGRES_PASSWORD: nexus_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar pacote e dependências de testes
        run: python -m pip install -e '.[dev,voice,vision]'
      - name: Preparar display virtual Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk espeak-ng alsa-utils
      - name: Verificar código e integração real
        run: |
          python -m compileall -q nexus tests
          xvfb-run -a pytest -q -rs -W error::pytest.PytestUnraisableExceptionWarning
      - name: Verificar executável Linux
        run: nexus-core --version

  candidate_tag:
    name: Marcar candidato v0.9.12-rc.1 após CI da main
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Confirmar SHA e criar tag de código candidato
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.9.12-rc.1
          git fetch origin main --tags
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$version" != "0.9.12" || "$(git rev-parse HEAD)" != "$EXPECTED_SHA" || "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]]; then
            echo "A main avançou ou a versão não é 0.9.12; tag não criada." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$EXPECTED_SHA" || {
              echo "A tag candidata já aponta para outro SHA; não mover." >&2
              exit 1
            }
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m 'Nexus Core 0.9.12 RC1: código candidato; aceite físico pendente'
          git push origin "refs/tags/$tag"
