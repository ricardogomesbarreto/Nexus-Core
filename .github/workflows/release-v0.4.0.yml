name: Publish Nexus Core v0.4.0

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish tested release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm tested commit is current main and version is 0.4.0
        id: validate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          git fetch origin main --tags
          if [[ "$version" != "0.4.0" || "$(git rev-parse origin/main)" != "$TESTED_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish immutable verified source snapshot
        if: steps.validate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git show-ref --verify --quiet refs/tags/v0.4.0; then
            git tag -a v0.4.0 -m "Nexus Core v0.4.0 — Persistent Memory Foundation"
            git push origin refs/tags/v0.4.0
          fi
          if ! gh release view v0.4.0 >/dev/null 2>&1; then
            gh release create v0.4.0 \
              --title "Nexus Core v0.4.0 — Persistent Memory Foundation" \
              --notes-file docs/RELEASE_NOTES_v0.4.0.md
          fi
