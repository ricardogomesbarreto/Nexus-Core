[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "0.4.1"
description = "Assistente pessoal local para Linux, com execução controlada"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Ricardo Gomes Barreto"}]
dependencies = ["psycopg[binary]==3.3.6"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
nexus-core = "nexus.main:cli"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
voice = ["vosk>=0.3.45,<0.4"]

[tool.setuptools.packages.find]
include = ["nexus*"]
