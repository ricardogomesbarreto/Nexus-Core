[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "0.9.19.dev1"
description = "Assistente pessoal local para Linux, com execução controlada"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Ricardo Gomes Barreto"}]
dependencies = ["psycopg[binary]==3.3.6"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
nexus-core = "nexus.main:cli"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
voice = ["vosk>=0.3.45,<0.4"]
vision = ["Pillow>=11,<13", "dbus-next>=0.2.3,<1"]
maps = ["pmtiles==3.8.1"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["assets/brand/*.png", "assets/ui/*.png"]
